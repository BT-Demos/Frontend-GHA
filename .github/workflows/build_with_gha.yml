name: Build with GHA

on:
    push:
         branches:
          - main 	
    workflow_dispatch:
env:
    artifact_version: 12.26
permissions:
      id-token: write
      contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Map the step's output to a job output
      artifact-id: ${{ steps.register.outputs.cbp_artifact_id }} 
    steps:
      - name: Compile Code
        run: echo "Compiling..."

      - name: Add Health Check Feature
        run: echo "Integration health check endpoint calls to backend ..."

      - name: Produce Binary
        run: sleep 5

      - name: Push binary
        run: echo "Pushing Binary to ECR..."

      - name: Register Build Artifacts in Cloudbees Platform
        id: register
        uses: cloudbees-io-gha/register-build-artifact@v3
        with:
          name: "Frontend-GHA"
          version: ${{ env.artifact_version }}
          url: docker.io/MyApp/Frontend-GHA:${{ env.artifact_version }}
          type: "docker"
          
      - name: Publish evidence
        uses: cloudbees-io-gha/publish-evidence-item@v2
        with:
          content: |-
            Build completed and artifacts published to CloudBees platform

  test:
    runs-on: ubuntu-latest
    needs: [build]   # Depends on 'build' job
    steps:
      - name: Run tests
        run: echo "Running Tests..."

      - name: Checkout to Collect Test Results
        uses: actions/checkout@v3

      - name: Publish Test Results in Cloudbees Plaform
        uses: cloudbees-io-gha/publish-test-results@v2
        with:
          test-type: GO
          results-path: test_reports/*
          cloudbees-pat: ${{ secrets.CBP_PAT_PROD }}
          
      - name: Publish evidence
        uses: cloudbees-io-gha/publish-evidence-item@v2
        with:
          content: |-
            Testing completed and results published to CloudBees platform
            Test | Results |
            --------|---------|
            Test 1 | PASS |
            Test 2 | FAIL |
            Test 3 | PASS |

      - name: Gitleaks scan
        uses: cloudbees-io-gha/gitleaks-scan-publish@v1

  deploy-preprod:
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Register deployed artifact
          uses: cloudbees-io-gha/register-deployed-artifact@v0
          with:
            artifact-id: ${{ needs.build.outputs.artifact-id }}
            target-environment: pre-prod
  deploy-qa:
      runs-on: ubuntu-latest
      needs: 
        - build
        - deploy-preprod
      steps:
        - name: Register deployed artifact
          uses: cloudbees-io-gha/register-deployed-artifact@v0
          with:
            artifact-id: ${{ needs.build.outputs.artifact-id }}
            target-environment: qa
        
